# conformance test refuses a code that is in neither list, so a new code has to
# be specified or owed in the same commit.
#
# A row leaves this list only when a rule row names its code AND every
# neighbour that row names has a case, which is what the conformance run
# checks; striking one off any earlier moves the debt rather than paying it.
