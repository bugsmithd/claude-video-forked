kind = "pytest"

[[rule]]
id = "STATUS-EDGE"
code = "E-STATUS-EDGE"
layer = "note-contract"
owner = "resolve_note.applied_target"
trigger = "the outbound edge names something and the caller supplied a corpus root to resolve it against"
refuses = "a named edge that opens as no file from the WORKING DIRECTORY THE GATE WAS RUN IN, the repository, or the repository's parent, because a phantom path claims the same absent edge as a blank field. The note's own directory is not one of the three, though the defect message says it is; and the first of the three is ambient, so the same note can pass or fail on where the operator stood"
