# Layer 1 — the note contract.
#
# Promoted from `spec/proposed-l1.toml`. Every row below names a rule the
# package implements, the neighbouring wrong answers it must ALSO refuse, and
# a case for each of them. `tests/test_spec_conformance.py` reads this file and
# fails when a neighbour names a case that does not exist, which is the whole
# mechanism: an unlisted neighbour is a red row rather than a review finding
# four rounds later.
#
# SOURCE-OF-TRUTH: watch-quality/src/watchquality/, branch review-gate-rounds.
# Every `refuses` line below was re-derived against the code by driving the
# owning function, not read off the draft. Where the draft and the code
# disagreed, the row states the CODE's behaviour and the gap list at the end
# names the disagreement.
#
# Every `exit` was read off resolve_note.main: each of --check, --report,
# --write, --stamp and --refresh-sidecar ends `return 1 if defects else 0`, and
# the four sibling gates that inherit E-READ / E-FRONTMATTER / E-NO-VIDEO-ID
# (anchor_manifest, ocr_vote, spoken_vote, wq_corpus_scan) end the same way.
# Exit 2 is reserved for usage and IO — an unknown path, an empty corpus, or
# --stamp with the distribution not installed — and no rule here reaches it.
#
# ONE ROW CARRIES NO `exit` AT ALL: CITE-PKGSPEC. Its code cannot be printed by
# any run — every production caller applies the same address pattern before
# calling, so the branch is reachable only by calling the resolver directly —
# and a number there would claim a run that does not exist. The row says so in
# its `refuses` line and its fourth neighbour proves it.
#
# THE DRAFT'S SELFTEST ADDRESSES DID NOT SURVIVE PROMOTION. It spelled them
# `resolve_note.py::selftest:<line>`, and the conformance reader derives a
# selftest label as `<module>::<the first string argument of a call inside
# selftest>` — so no line-numbered address is in the pool and every one of them
# would have been a red row. `resolve_note.selftest` has no `check(...)`
# comparator either: it asserts inline, so the only labels it offers are the
# defect-code prefixes its assertions happen to pass to `startswith`, and four
# distinct neighbours would collapse onto one address. Every neighbour here is
# therefore a pytest case, written by hand against the module. That also pays
# down the draft's own second gap: this layer had four pytest cases in total
# and thirty-two rules pinned only where pytest never looks.
#
# Examples are invented (VID, docs/x.md, fakepkg@1.0.0). Nothing here opens a
# note under notes/.

# --- reading the file at all -------------------------------------------------

[[rule]]
id = "READ"
code = "E-READ"
layer = "note-contract"
owner = "resolve_note.safe_read"
trigger = "any gate opens a note, before anything in it is parsed"
refuses = "a file whose bytes cannot be turned into text, naming the reason instead of raising"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note with one byte that is not valid UTF-8, named by its offset"
test = "tests/test_spec_note_contract.py::test_a_note_with_one_undecodable_byte_is_named_rather_than_raised"
kind = "pytest"
[[rule.neighbour]]
case = "a directory handed in where a note was expected, which fails as an OS error rather than a decode error"
test = "tests/test_spec_note_contract.py::test_a_directory_where_a_note_was_expected_reads_as_an_os_error"
kind = "pytest"
[[rule.neighbour]]
case = "a note that opens with a UTF-8 byte order mark, which decodes and must NOT be refused here"
test = "tests/test_spec_note_contract.py::test_a_byte_order_mark_decodes_and_is_not_a_read_defect"
kind = "pytest"
[[rule.neighbour]]
case = "the same undecodable note reached through anchor_manifest, ocr_vote and spoken_vote, which call this guard themselves and print the reason it hands back, word for word"
test = "tests/test_spec_note_contract.py::test_the_three_sibling_gates_print_this_code_from_their_own_copy_of_the_guard"
kind = "pytest"
[[rule.neighbour]]
case = "the same undecodable note reached through wq_corpus_scan, which does NOT share the guard: it re-reads the bytes lossily and refuses nothing, and prints this code only when the file cannot be opened at all"
test = "tests/test_spec_note_contract.py::test_the_corpus_scanner_does_not_share_the_guard_and_reads_bad_bytes_lossily"
kind = "pytest"

[[rule]]
id = "FRONTMATTER"
code = "E-FRONTMATTER"
layer = "note-contract"
owner = "resolve_note.split_frontmatter"
trigger = "a note has been read and its YAML block is looked for; check_note, write_note, refresh_sidecar and stamp_note each print this code from their own call, and anchor_manifest, ocr_vote and spoken_vote inherit the same rule"
refuses = "a file whose first line is not three dashes, or that never closes the block with a second three dashes"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note with a blank line before the opening three dashes"
test = "tests/test_spec_note_contract.py::test_a_blank_line_before_the_opening_marker_is_no_frontmatter"
kind = "pytest"
[[rule.neighbour]]
case = "a note opening with four dashes, which is not the marker"
test = "tests/test_spec_note_contract.py::test_four_dashes_are_not_the_opening_marker"
kind = "pytest"
[[rule.neighbour]]
case = "a note whose opening marker carries trailing spaces, which IS the marker and must not be refused"
test = "tests/test_spec_note_contract.py::test_trailing_spaces_after_the_marker_still_open_the_block"
kind = "pytest"
[[rule.neighbour]]
case = "a review report filed under a dated note-shaped name, which is not a note and must reach this code from no gate at all"
test = "tests/test_review_gate.py::test_a_report_is_not_a_note_even_when_the_gate_is_pointed_at_reviews"
kind = "pytest"

[[rule]]
id = "NO-VIDEO-ID"
code = "E-NO-VIDEO-ID"
layer = "note-contract"
owner = "resolve_note.write_note"
trigger = "a render is about to discard citation quotes and needs somewhere to record them; anchor_manifest, ocr_vote and spoken_vote print the same code when they cannot address their own index"
refuses = "writing a note that has citations to render and no video_id: field to address the audit sidecar with"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note with sets but no citations and no video_id, which is written and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_note_with_sets_and_no_citations_is_written_without_a_video_id"
kind = "pytest"
[[rule.neighbour]]
case = "the field spelled Video_id:, which is not the field"
test = "tests/test_spec_note_contract.py::test_the_field_spelled_with_a_capital_v_is_not_the_field"
kind = "pytest"
[[rule.neighbour]]
case = "an empty video_id: whose value sits on the next line, which the anchored pattern reads as absent"
test = "tests/test_spec_note_contract.py::test_a_video_id_whose_value_sits_on_the_next_line_reads_as_absent"
kind = "pytest"
[[rule.neighbour]]
case = "a video_id: of TODO, which is present, meaningless, and accepted"
test = "tests/test_spec_note_contract.py::test_a_video_id_of_todo_is_present_and_meaningless_and_accepted"
kind = "pytest"

# --- the runtime, which is the only denominator density has -------------------

[[rule]]
id = "DURATION"
code = "E-DURATION"
layer = "note-contract"
owner = "resolve_note.parse_duration"
trigger = "a note's frontmatter is read for the runtime the whole density check divides by"
refuses = "a duration: field that is absent, or present and not one to three colon-separated groups where only the leading group may exceed 59"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "four groups, which used to parse as a runtime of over two days"
test = "tests/test_spec_note_contract.py::test_four_colon_separated_groups_are_not_a_runtime"
kind = "pytest"
[[rule.neighbour]]
case = "a minutes group of 75, which is not a clock reading"
test = "tests/test_spec_note_contract.py::test_a_minutes_group_of_seventy_five_is_not_a_clock_reading"
kind = "pytest"
[[rule.neighbour]]
case = "a value on the NEXT line, which a newline-blind pattern would read as the runtime"
test = "tests/test_spec_note_contract.py::test_a_duration_whose_value_sits_on_the_next_line_is_not_read"
kind = "pytest"
[[rule.neighbour]]
case = "a leading group of 90, which is ninety minutes and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_leading_group_of_ninety_is_ninety_minutes"
kind = "pytest"
[[rule.neighbour]]
case = "a value of n/a, which is refused only because it holds no digits, not because anything read it"
test = "tests/test_spec_note_contract.py::test_a_duration_of_n_slash_a_holds_no_digits_for_the_pattern"
kind = "pytest"

[[rule]]
id = "DURATION-ZERO"
code = "E-DURATION-ZERO"
layer = "note-contract"
owner = "resolve_note.check_note"
trigger = "the runtime parsed cleanly and is about to be used as a divisor"
refuses = "a runtime of zero seconds, because density then has no denominator"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a duration of 0:00"
test = "tests/test_spec_note_contract.py::test_a_two_group_zero_runtime_leaves_density_no_denominator"
kind = "pytest"
[[rule.neighbour]]
case = "a duration of 0:00:00, the same zero spelled with three groups"
test = "tests/test_spec_note_contract.py::test_a_three_group_zero_runtime_is_the_same_zero"
kind = "pytest"
[[rule.neighbour]]
case = "a duration of 0:01, which is one second and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_runtime_of_one_second_still_has_a_denominator"
kind = "pytest"
[[rule.neighbour]]
case = "a note with a zero runtime and an anchor past it, where this code returns first and the anchor is never looked at"
test = "tests/test_spec_note_contract.py::test_a_zero_runtime_returns_before_any_anchor_is_looked_at"
kind = "pytest"

# --- the numbers the note states about itself --------------------------------

[[rule]]
id = "DENSITY-MISSING"
code = "E-DENSITY-MISSING"
layer = "note-contract"
owner = "resolve_note.check_note"
trigger = "a note passed the runtime checks and the caller has not asked for density to be optional"
refuses = "a note whose body states no sentence about density that also states a word count, a number of video-minutes, or a rate in words per video-minute — those three phrasings are the whole vocabulary, and a number in any other shape declares nothing"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note that says density and gives no number at all"
test = "tests/test_spec_note_contract.py::test_the_word_density_with_no_number_declares_nothing"
kind = "pytest"
[[rule.neighbour]]
case = "a note that says density and gives a number in none of the three phrasings, which is refused exactly as the numberless one is"
test = "tests/test_spec_note_contract.py::test_a_density_sentence_whose_number_is_in_no_declaring_shape_declares_nothing"
kind = "pytest"
[[rule.neighbour]]
case = "a note that states one number only, which counts as a declaration and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_density_sentence_stating_one_number_is_a_declaration"
kind = "pytest"
[[rule.neighbour]]
case = "a run asked for --no-require-density, where the same note passes"
test = "tests/test_spec_note_contract.py::test_a_run_that_did_not_ask_for_density_accepts_a_note_without_one"
kind = "pytest"
[[rule.neighbour]]
case = "the word density inside a fenced code block, which nothing strips and which therefore satisfies the rule"
test = "tests/test_spec_note_contract.py::test_a_density_line_inside_a_fenced_block_still_counts_as_declared"
kind = "pytest"

[[rule]]
id = "DENSITY-WORDS"
code = "E-DENSITY-WORDS"
layer = "note-contract"
owner = "resolve_note.check_note"
trigger = "a density sentence states a word count"
refuses = "any stated word count that is not exactly the count of whitespace-split tokens in the rendered body once the marks a script wrote into it are removed — the ORPHAN and auto-demoted markers, the integrity blockquote and the Speculation heading, all four written by the demotion renderer"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a body carrying the integrity blockquote the demotion renderer wrote, whose tokens are the tool's and are not counted, so a render does not move the number the note declares"
test = "tests/test_spec_note_contract.py::test_the_marks_the_demotion_renderer_wrote_are_not_the_authors_words"
kind = "pytest"
[[rule.neighbour]]
case = "a hedged count written with a tilde, which is the estimate the whole check exists to kill"
test = "tests/test_spec_note_contract.py::test_a_hedged_word_count_is_read_as_the_exact_number_it_states"
kind = "pytest"
[[rule.neighbour]]
case = "a count that is off by one, which the zero tolerance still refuses"
test = "tests/test_spec_note_contract.py::test_a_word_count_off_by_one_is_refused_by_the_zero_tolerance"
kind = "pytest"
[[rule.neighbour]]
case = "a decimal count, which must parse as itself rather than as its last digit"
test = "tests/test_spec_note_contract.py::test_a_decimal_word_count_parses_as_itself"
kind = "pytest"
[[rule.neighbour]]
case = "a second, unrelated word count later in the same paragraph, which is outside the sentence and must NOT be read as the declaration"
test = "tests/test_spec_note_contract.py::test_a_later_unrelated_word_count_is_outside_the_declaring_sentence"
kind = "pytest"

[[rule]]
id = "DENSITY-MINUTES"
code = "E-DENSITY-MINUTES"
layer = "note-contract"
owner = "resolve_note.check_note"
trigger = "a density sentence states a number of video-minutes"
refuses = "a stated minute count more than half a minute away from the runtime the frontmatter declares"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a stated minute count wrong by two minutes"
test = "tests/test_spec_note_contract.py::test_a_minute_count_wrong_by_two_minutes_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a stated minute count wrong by exactly half a minute, which is the boundary and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_minute_count_wrong_by_exactly_half_a_minute_is_the_boundary"
kind = "pytest"
[[rule.neighbour]]
case = "a declaration written before the sentence, reading backwards from the word density"
test = "tests/test_spec_note_contract.py::test_a_declaration_written_before_the_word_density_is_still_read"
kind = "pytest"
[[rule.neighbour]]
case = "video-minute in the singular, which the pattern also accepts"
test = "tests/test_spec_note_contract.py::test_video_minute_in_the_singular_is_also_a_declaration"
kind = "pytest"

[[rule]]
id = "DENSITY-WPM"
code = "E-DENSITY-WPM"
layer = "note-contract"
owner = "resolve_note.check_note"
trigger = "a density sentence states words per video-minute"
refuses = "a stated rate more than half a word per minute away from the counted words divided by the runtime"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a rate that is wrong and stated in bold, where the emphasis markers must not hide the number"
test = "tests/test_spec_note_contract.py::test_emphasis_markers_do_not_hide_a_wrong_rate"
kind = "pytest"
[[rule.neighbour]]
case = "a rate whose phrase wraps across a hard-wrapped line"
test = "tests/test_spec_note_contract.py::test_a_rate_phrase_that_wraps_across_a_line_is_still_read"
kind = "pytest"
[[rule.neighbour]]
case = "a rate wrong by exactly half a word per minute, which is the boundary and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_rate_wrong_by_exactly_half_a_word_per_minute_is_the_boundary"
kind = "pytest"
[[rule.neighbour]]
case = "a note stating the rate three times, where every wrong statement has to be reported and not just the first"
test = "tests/test_spec_note_contract.py::test_every_wrong_rate_statement_is_reported_not_only_the_first"
kind = "pytest"

# --- citations of a file in this repository ----------------------------------

[[rule]]
id = "CITE-EMPTY"
code = "E-CITE-EMPTY"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "a well-formed citation token has been found and its quote is about to be looked for"
refuses = "a quote that has nothing left in it once whitespace, asterisks and backticks are removed"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a quote of no characters at all"
test = "tests/test_spec_note_contract.py::test_a_citation_quoting_nothing_at_all_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a quote of one space, which normalises to nothing"
test = "tests/test_spec_note_contract.py::test_a_quote_of_one_space_normalises_to_nothing"
kind = "pytest"
[[rule.neighbour]]
case = "a quote of only emphasis characters, which also normalises to nothing"
test = "tests/test_spec_note_contract.py::test_a_quote_of_only_emphasis_characters_normalises_to_nothing"
kind = "pytest"
[[rule.neighbour]]
case = "a quote of a single visible character, which is meaningless and is NOT refused"
test = "tests/test_spec_note_contract.py::test_a_quote_of_a_single_visible_character_is_not_empty"
kind = "pytest"

[[rule]]
id = "CITE-MALFORMED"
code = "E-CITE-MALFORMED"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "the body is swept a second time for text that opens a citation"
refuses = "anything that starts a citation and never closes as a path, a hash and a quoted phrase, so a typo cannot pass as zero citations"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a token whose closing quote is missing"
test = "tests/test_spec_note_contract.py::test_a_citation_whose_closing_quote_is_missing_is_reported"
kind = "pytest"
[[rule.neighbour]]
case = "a token written with a space instead of a colon after the keyword"
test = "tests/test_spec_note_contract.py::test_a_space_instead_of_a_colon_after_the_keyword_is_reported"
kind = "pytest"
[[rule.neighbour]]
case = "an unclosed token followed by a good one, which must report two defects and not swallow the second"
test = "tests/test_spec_note_contract.py::test_an_unclosed_token_does_not_swallow_the_citation_after_it"
kind = "pytest"
[[rule.neighbour]]
case = "the keyword in lower case, which the strict pattern will not read and the loose sweep will"
test = "tests/test_spec_note_contract.py::test_a_lower_case_keyword_is_read_only_by_the_loose_sweep"
kind = "pytest"
[[rule.neighbour]]
case = "a stray closing marker with no opening one, which nothing sweeps for and which passes"
test = "tests/test_spec_note_contract.py::test_a_stray_closing_marker_is_swept_for_by_nothing"
kind = "pytest"

[[rule]]
id = "CITE-PATH"
code = "E-CITE-PATH"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "a citation names something that is not a package address, so it is joined to the corpus root"
refuses = "a cited path that lands outside the repository once symlinks and dot segments are resolved"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a path climbing out with parent-directory segments"
test = "tests/test_spec_note_contract.py::test_a_cited_path_climbing_out_with_parent_segments_is_outside"
kind = "pytest"
[[rule.neighbour]]
case = "an absolute path, which replaces the root entirely when joined"
test = "tests/test_spec_note_contract.py::test_an_absolute_cited_path_replaces_the_root_entirely"
kind = "pytest"
[[rule.neighbour]]
case = "a link inside the repository pointing at a file outside it"
test = "tests/test_spec_note_contract.py::test_a_link_inside_the_repository_pointing_out_of_it_is_outside"
kind = "pytest"
[[rule.neighbour]]
case = "a package address, which is routed to the installed distribution instead and resolves there — asserting the absence of this code would prove nothing, because a package address joined to the corpus root still lands INSIDE it"
test = "tests/test_spec_note_contract.py::test_a_package_address_is_outside_the_repository_on_purpose"
kind = "pytest"

[[rule]]
id = "CITE-NOFILE-REPO"
code = "E-CITE-NOFILE"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "a cited repository path is inside the repository and is about to be opened"
refuses = "a path that names no file, so the claim has no document behind it"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a path that never existed"
test = "tests/test_spec_note_contract.py::test_a_cited_path_that_never_existed_has_no_document_behind_it"
kind = "pytest"
[[rule.neighbour]]
case = "a path that names a directory, which exists and is still not a file"
test = "tests/test_spec_note_contract.py::test_a_cited_path_naming_a_directory_exists_and_is_not_a_file"
kind = "pytest"
[[rule.neighbour]]
case = "a token that wrapped between its path and its hash, where the collapsed path does exist and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_token_wrapped_before_its_hash_still_names_the_real_path"
kind = "pytest"
[[rule.neighbour]]
case = "an empty path with a real quote, which joins to the root itself and is not a file"
test = "tests/test_spec_note_contract.py::test_an_empty_cited_path_joins_to_the_root_and_is_not_a_file"
kind = "pytest"

[[rule]]
id = "CITE-NOMATCH"
code = "E-CITE-NOMATCH"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "the cited file opened and its text has been normalised with block boundaries marked"
refuses = "a quote that does not occur in the cited file inside one markdown block, which is a claim attributed to a document that never made it"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "words that read plausibly and are not in the document in that order"
test = "tests/test_spec_note_contract.py::test_a_plausible_quote_absent_from_the_cited_file_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "words that all appear but sit either side of a blank line and a table header"
test = "tests/test_spec_note_contract.py::test_a_quote_spanning_a_blank_line_and_a_table_header_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a quote missing an underscore, which used to match the real identifier"
test = "tests/test_spec_note_contract.py::test_a_quote_missing_an_underscore_no_longer_matches_the_identifier"
kind = "pytest"
[[rule.neighbour]]
case = "a correct quote that wraps across a hard-wrapped newline, which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_correct_quote_that_wraps_across_a_newline_still_resolves"
kind = "pytest"

[[rule]]
id = "CITE-SELF"
code = "E-CITE-SELF"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "a citation has resolved to a real file and the note being checked is known"
refuses = "a note citing itself, because a note is not evidence for itself"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note citing its own filename"
test = "tests/test_spec_note_contract.py::test_a_note_citing_its_own_filename_is_not_evidence_for_itself"
