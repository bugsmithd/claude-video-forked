[[rule]]
id = "CITE-UNREADABLE"
code = "E-CITE-UNREADABLE"
layer = "note-contract"
owner = "resolve_note.resolve_citations"
trigger = "a cited file exists and its text is being read"
refuses = "a cited file whose bytes are not text, which is a different failure from the file being absent"
excused_by = []
