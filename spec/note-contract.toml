refuses = "a stated count that does not equal the number of list items it introduces"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a paragraph claiming four items above a list of three"
test = "tests/test_spec_note_contract.py::test_a_paragraph_claiming_four_items_above_a_list_of_three"
kind = "pytest"
[[rule.neighbour]]
case = "a claim inside a list row, whose SIBLING rows are not its members and must NOT be counted"
test = "tests/test_spec_note_contract.py::test_sibling_rows_are_not_the_members_of_a_claim_inside_a_list_row"
kind = "pytest"
[[rule.neighbour]]
case = "a claim inside a list row with a wrong-length list indented under it, which IS its enumeration"
test = "tests/test_spec_note_contract.py::test_a_list_indented_under_a_claim_row_is_its_enumeration"
kind = "pytest"
[[rule.neighbour]]
case = "a count followed by a comma list in prose and no markdown list, which is not counted"
test = "tests/test_spec_note_contract.py::test_a_comma_list_in_prose_with_no_markdown_list_is_not_counted"
kind = "pytest"
[[rule.neighbour]]
case = "a cardinality that enumerates nothing, such as a span of minutes or years, which is kept out only by the absent colon"
test = "tests/test_spec_note_contract.py::test_a_cardinality_that_enumerates_nothing_is_not_counted"
kind = "pytest"

# --- the untokenised-path floor ----------------------------------------------

[[rule]]
id = "BARE-PATH"
