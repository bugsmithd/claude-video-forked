[[rule]]
id = "STATUS-UNKNOWN"
code = "E-STATUS-UNKNOWN"
layer = "note-contract"
owner = "resolve_note.check_status"
trigger = "a status line was read and normalised"
refuses = "a value outside the four the corpus knows, which is neither a claim nor an admission"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a plausible word that is not in the vocabulary"
test = "tests/test_spec_note_contract.py::test_a_plausible_word_outside_the_vocabulary"
kind = "pytest"
[[rule.neighbour]]
case = "an empty value, which reads as unknown rather than as missing"
test = "tests/test_spec_note_contract.py::test_an_empty_status_value_reads_as_unknown_rather_than_missing"
kind = "pytest"
[[rule.neighbour]]
case = "a value whose text sits on the NEXT line, which the anchored pattern reads as empty"
test = "tests/test_spec_note_contract.py::test_a_status_value_on_the_next_line_reads_as_empty"
