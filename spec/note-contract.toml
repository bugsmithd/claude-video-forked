kind = "pytest"
[[rule.neighbour]]
case = "a path in a directory or with a suffix the pattern does not list, which is asserted in prose and is not refused"
test = "tests/test_spec_note_contract.py::test_a_path_in_an_unlisted_directory_is_not_matched_at_all"
kind = "pytest"
[[rule.neighbour]]
case = "a bare path below a citation token that wrapped across lines, which is still refused but at a line number shifted by the removed newlines"
test = "tests/test_spec_note_contract.py::test_a_bare_path_below_a_wrapped_token_is_reported_at_a_shifted_line"
kind = "pytest"

# --- the outbound edge -------------------------------------------------------

[[rule]]
id = "STATUS-MISSING"
code = "E-STATUS-MISSING"
layer = "note-contract"
owner = "resolve_note.check_status"
trigger = "a note's frontmatter is read for the field that says how far the note got"
