kind = "pytest"

# --- the stamp, which is a claim about a MOMENT ------------------------------
# `graded_with:` does not record a version. It records that a named build of
# these checks found this note clean AT THE TIME the stamp was written, and it
# can only be written by --stamp on a note that is clean then. That is why a
# different installed version makes it stale rather than wrong: the claim is
# still true about its moment and is no longer comparable with this one.

[[rule]]
id = "GRADE-UNSTAMPED"
code = "E-GRADE-UNSTAMPED"
layer = "note-contract"
owner = "resolve_note.check_grade"
trigger = "a note is checked on a machine where the distribution is installed"
refuses = "a note carrying no record THE PATTERN CAN READ of which build found it clean, so its pass is attributed to no moment at all — a record whose value holds a space is unreadable to it and is reported as absent, in a message that denies a line the file contains"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a record present but written with a space in its value, which the pattern cannot span, so it is reported as no record at all"
test = "tests/test_spec_note_contract.py::test_a_graded_with_record_written_with_a_space_is_reported_as_absent"
kind = "pytest"
[[rule.neighbour]]
case = "a note with no such field"
test = "tests/test_spec_note_contract.py::test_a_note_with_no_graded_with_field_attributes_its_pass_to_nothing"
kind = "pytest"
[[rule.neighbour]]
case = "the field present with nothing after the colon"
test = "tests/test_spec_note_contract.py::test_a_graded_with_field_with_nothing_after_the_colon"
kind = "pytest"
[[rule.neighbour]]
case = "the field holding a pair of quotation marks, which this reader does NOT normalise, so it is treated as a value and reported as stale instead"
test = "tests/test_spec_note_contract.py::test_a_graded_with_field_of_two_quotation_marks_is_treated_as_a_value"
kind = "pytest"
[[rule.neighbour]]
case = "a run where the distribution is not installed, which is silent by design and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_run_where_the_distribution_is_not_installed_is_silent"
kind = "pytest"

[[rule]]
id = "GRADE-STALE"
code = "E-GRADE-STALE"
layer = "note-contract"
owner = "resolve_note.check_grade"
trigger = "a note records which build found it clean and that build is compared with the installed one"
refuses = "a record naming any build other than the one installed now, because the note's pass is no longer comparable with this run"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a record naming an older release"
test = "tests/test_spec_note_contract.py::test_a_record_naming_an_older_release_is_no_longer_comparable"
kind = "pytest"
[[rule.neighbour]]
case = "a record naming the installed version with a trailing zero added, which packaging calls the same release and this string comparison calls different"
test = "tests/test_spec_note_contract.py::test_a_record_with_a_trailing_zero_added_is_a_different_string"
kind = "pytest"
[[rule.neighbour]]
case = "a record naming a different distribution entirely at the right version"
test = "tests/test_spec_note_contract.py::test_a_record_naming_a_different_distribution_at_the_right_version"
kind = "pytest"
[[rule.neighbour]]
case = "a record naming exactly the installed build, which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_record_naming_exactly_the_installed_build"
kind = "pytest"

[[rule]]
id = "GRADE-EXEMPT"
code = "E-GRADE"
layer = "note-contract"
owner = "resolve_note.stamp_note"
trigger = "a stamp is about to be written and the note's outstanding defects are counted"
refuses = "letting the grade family count as a reason to withhold the stamp that would repair it, so a stale or absent record does not lock itself in"
excused_by = []
exit = 0

[[rule.neighbour]]
case = "a note whose only defect is that it records an older build, which must still be stamped"
test = "tests/test_spec_note_contract.py::test_a_note_whose_only_defect_is_an_older_record_is_still_stamped"
kind = "pytest"
[[rule.neighbour]]
case = "a note whose only defect is that it records no build at all, which must still be stamped"
test = "tests/test_spec_note_contract.py::test_a_note_whose_only_defect_is_no_record_at_all_is_still_stamped"
kind = "pytest"
[[rule.neighbour]]
case = "a note carrying a real defect as well as a stale record, which must NOT be stamped"
test = "tests/test_spec_note_contract.py::test_a_note_with_a_real_defect_and_a_stale_record_is_not_stamped"
kind = "pytest"
[[rule.neighbour]]
case = "a defect line from another family that merely mentions the grade prefix in its text, which this prefix match drops — so a note with an outstanding defect is stamped clean"
test = "tests/test_spec_note_contract.py::test_a_defect_line_that_merely_mentions_the_grade_prefix_is_dropped"
kind = "pytest"

[[rule]]
id = "STAMP-REFUSED"
code = "E-STAMP-REFUSED"
layer = "note-contract"
owner = "resolve_note.stamp_note"
trigger = "a stamp is asked for on a named note"
refuses = "recording a pass on a note that is defective at that moment, because such a record reads later as a build having passed it"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note carrying an ordinary defect, which is refused and left byte-for-byte as it was"
test = "tests/test_spec_note_contract.py::test_a_note_carrying_an_ordinary_defect_is_refused_and_left_untouched"
kind = "pytest"
[[rule.neighbour]]
case = "a note whose only defect is that it declares no density, which the default stamp grades exactly as the default check does"
test = "tests/test_spec_note_contract.py::test_a_note_declaring_no_density_is_graded_by_the_default_stamp"
kind = "pytest"
[[rule.neighbour]]
case = "the same note stamped through the command line rather than the function, where the flags must be passed through"
test = "tests/test_review_gate.py::test_the_stamp_entry_point_grades_as_hard_as_check_does"
kind = "pytest"
[[rule.neighbour]]
case = "a note already carrying this exact record, which is left alone and is neither refused nor rewritten"
test = "tests/test_spec_note_contract.py::test_a_note_already_carrying_this_exact_record_is_left_alone"
kind = "pytest"
[[rule.neighbour]]
case = "a clean note that a stamp of a NEIGHBOURING note has just made stale, which one pass cannot finish and which the second round must reach"
test = "tests/test_spec_note_contract.py::test_stamping_one_note_makes_its_neighbour_stale_for_a_second_round"
kind = "pytest"

# --- anchors, the only cross-check the runtime has ---------------------------

[[rule]]
id = "ANCHOR-RANGE"
code = "E-ANCHOR-RANGE"
layer = "note-contract"
owner = "resolve_note.check_anchors"
trigger = "a note's runtime parsed and is not zero, so the timestamps in the body can be compared with it"
refuses = "a backticked timestamp later than the declared runtime, which cites a moment the recording does not have"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a timestamp well past the end of the recording"
test = "tests/test_spec_note_contract.py::test_a_timestamp_well_past_the_end_of_the_recording"
kind = "pytest"
[[rule.neighbour]]
case = "a timestamp beside a reference to another note, which legitimately belongs to a different recording and must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_timestamp_beside_a_reference_to_another_note_is_exempt"
kind = "pytest"
[[rule.neighbour]]
case = "a timestamp exactly equal to the runtime, which is the boundary and is not refused"
test = "tests/test_spec_note_contract.py::test_a_timestamp_exactly_equal_to_the_runtime_is_the_boundary"
kind = "pytest"
[[rule.neighbour]]
case = "a timestamp on the line ABOVE a reference to another note, which the forward-only exemption window does not cover"
test = "tests/test_spec_note_contract.py::test_a_timestamp_on_the_line_above_a_reference_is_not_exempt"
kind = "pytest"
[[rule.neighbour]]
case = "a timestamp past the runtime in a note whose runtime does not parse, where the runtime defect returns first and the timestamp is never looked at"
test = "tests/test_spec_note_contract.py::test_an_unparseable_runtime_returns_before_any_timestamp_is_read"
kind = "pytest"

# --- the peer band -----------------------------------------------------------

[[rule]]
id = "BAND"
code = "E-BAND"
layer = "note-contract"
owner = "resolve_note.check_band"
trigger = "every note in the corpus has been counted, so the real spread of rates is known"
refuses = "a declared peer band whose ends are more than half a word per minute from the ends the corpus actually spans"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a band declared far from the computed one"
test = "tests/test_spec_note_contract.py::test_a_band_declared_far_from_the_computed_one"
kind = "pytest"
[[rule.neighbour]]
case = "a band whose ends are each within a rounding step, which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_band_within_a_rounding_step_of_the_computed_one"
kind = "pytest"
[[rule.neighbour]]
case = "a run over a corpus where no note has a countable rate, so there is no band and nothing is checked"
test = "tests/test_spec_note_contract.py::test_a_corpus_with_no_countable_rate_has_no_band_to_check"
kind = "pytest"
[[rule.neighbour]]
case = "a band declared with its ends the wrong way round, which is compared end for end and refused for the wrong reason"
test = "tests/test_spec_note_contract.py::test_a_band_declared_with_its_ends_the_wrong_way_round"
kind = "pytest"
[[rule.neighbour]]
case = "a band declared inside a quotation of another note's text, which is still read as this note's claim"
test = "tests/test_spec_note_contract.py::test_a_band_inside_a_quotation_is_still_read_as_this_notes_claim"
kind = "pytest"

# =============================================================================
# THE GAP LIST.
# =============================================================================
#
# 1. RULES LEFT IN THE DRAFT — none. All 45 rows the draft carried are here,
#    and all 206 neighbours they name have a case. 202 of those cases are in
#    tests/test_spec_note_contract.py; the other four were already in the suite
#    and are cited rather than copied:
#
#      tests/test_review_gate.py::test_a_report_is_not_a_note_even_when_the_gate_is_pointed_at_reviews
#      tests/test_review_gate.py::test_auditing_one_note_does_not_orphan_the_others
#      tests/test_review_gate.py::test_an_applied_field_that_says_nothing_is_not_an_edge
#      tests/test_review_gate.py::test_the_stamp_entry_point_grades_as_hard_as_check_does
#
#    Those four are the one dependency this file has on a test it does not own:
#    renaming any of them turns a row here red, which is the intended
#    behaviour but is worth knowing before the rename.
#
#    A fifth was cited and has been dropped. READ's sibling-gate neighbour
#    named tests/test_corpus_scan.py::test_a_run_that_walked_no_file_is_refused_too,
#    which asserts three exit codes and a stderr string, never this code, and
#    opens a path that does not exist rather than one that cannot be decoded.
#    Renaming this code in all four sibling modules left it green. It is
#    replaced by two cases here, one per direction, and by the correction in
#    3h below.
#
# 2. NEIGHBOURS THAT COULD NOT BE WRITTEN WITHOUT CHANGING SOURCE — none. Two
#    needed care rather than a source change and are recorded here so the next
#    reader does not re-derive them:
#
#    a. The two permission cases — a cited file and a sidecar the process may
#       not open — set mode 0o000 and are SKIPPED when the suite runs as root,
#       because a permission bit does not stop root and the case could not
#       fire. On an ordinary account they run.
#       [tests/test_spec_note_contract.py, `not_as_root`]
#
#    b. `E-CITE-UNREADABLE` reached through the PACKAGE path needs an installed
#       distribution shipping a file that is not text. Writing one into
#       watchquality/ would be a source change, so the case builds a
#       distribution in a temporary directory with its own `.dist-info` and
#       puts it on sys.path — which is the same thing to
#       `importlib.metadata`, and is what the resolver actually asks.
#       [tests/test_spec_note_contract.py, `fake_dist`]
#
# 3. WHERE THE CODE AND ITS DOCSTRING DISAGREE.
#
#    a. `check_sidecar` refuses a row with fewer than THREE columns and its
#       message reads "<n> of 4 columns". The reader is told the shape is four
#       and the check enforces three, so a three-column row — a recorded
#       citation with no quote — passes the ordinary check and is refused only
#       by the refresh path, which demands four. One code, two thresholds.
#       [watch-quality/src/watchquality/resolve_note.py:810-814 against :875-877]
#
#    b. `package_target`'s docstring presents E-CITE-PKGSPEC as one of the
#       distinct failures a reader will meet. It is unreachable from any
#       ordinary run: all three production callers apply the same
#       name@version:path pattern before calling, so a value that would fail it
#       is never sent down this path. Only a direct call raises it.
#       [resolve_note.py:518-520, guarded at :592, :817, :888]
#
#    c. `check_grade`'s docstring names three states and calls the third
#       "uninstallable ... Silent". Silent is correct, and it means the whole
#       grade family is switched off wherever the distribution is not
#       installed — including CI images that run the checks from a source tree.
#       The docstring frames this as a courtesy; in effect it is a condition
#       under which two rules never fire.
#       [resolve_note.py:942-947]
#
#    d. The module docstring says E-BARE-PATH is "exempt under `## Action`".
#       The exemption is keyed on an exact two-hash heading whose text is
#       Action; a three-hash heading of the same name does not set the section
#       and does not exempt, and once set the section persists until the next
#       two-hash heading. Neither behaviour is written down.
#       [resolve_note.py:49-52 against :1146-1152]
#
#    e. `E-GRADE` is listed as a code of this module and is not a defect
#       string. The conformance scanner reads codes out of the source text, and
#       the only occurrence is the prefix literal used to drop the grade family
#       before a stamp decides. The GRADE-EXEMPT row above describes that
#       filter as the rule, which is what the code does, but a reader looking
#       for a printed `E-GRADE` line will never find one.
#       [resolve_note.py:977]
#
#    f. `check_anchors`'s docstring says anchors "near a reference to another
#       note are exempt". The window is forward-only — the reference's own line
#       and the two below it — so an anchor on the line ABOVE a reference is
#       not exempt. "Near" reads as symmetric and is not.
#       [resolve_note.py:1096-1098 against :1102-1106]
#
#    g. `check_enumerations`'s docstring argues the check is narrow enough not
#       to fire on prose, and measures that narrowness on the corpus: "widening
#       this to every 'three minutes' would fire 111 times". A span of minutes
#       IS counted today whenever it is written with a colon and a markdown
#       list follows it — "It ran for three minutes:" above two bullets reports
#       `declared three minutes but 2 listed`. What keeps the count down is the
#       colon, not the noun, and the docstring does not say so.
#       [resolve_note.py:724-761 against :133-134]
#
#    h. `E-READ` is not one guard printed by four modules. anchor_manifest,
#       ocr_vote and spoken_vote each call `safe_read` and print the reason it
#       returns, so an undecodable note is refused there in the same words.
#       wq_corpus_scan does not call it: it catches UnicodeDecodeError and
#       re-reads the file with replacement characters, deliberately, so one
#       latin-1 subtitle cannot abort the walk — and it prints `E-READ` only
#       for an OSError, with the exception's own text. An undecodable file is
#       therefore refused by three of the four and by none of the walk.
#       [wq_corpus_scan.py:260-279 against resolve_note.py:492-501]
#
#    i. `E-STATUS-EDGE`'s message names the note as its first base. The code's
#       first base is `Path(value).expanduser()`, which for a relative value is
#       the PROCESS's working directory; the note's own directory is never
#       tried. So a note beside `sibling.md` is told the file resolves from
#       nowhere, and a note next to no file at all passes whenever the operator
#       happened to stand in a directory that holds the path. The row above
#       states the real bases and both directions have a case; the MESSAGE
#       still says "from the note", and correcting it is a source edit.
#       [resolve_note.py:1174-1187 against :1217-1219]
#
# 4. NEIGHBOURS WHOSE `case` LINE WAS REWRITTEN BECAUSE THE DRAFT HAD IT WRONG.
#    Each was re-derived by driving the owning function; the draft's wording is
#    quoted first.
#
#    a. CITE-NOPKG, "a distribution name spelled with an underscore where the
#       installed one uses a dash". The draft filed this under a rule that
#       REFUSES. `importlib.metadata` normalises a distribution name, so
#       `watch_quality@X:resolve_note.py` resolves exactly as the dashed
#       spelling does. Rewritten as a must-NOT-fire.
#       [resolve_note.py:522-525]
#
#    b. STATUS-NOEDGE, "an edge field holding YAML's own word for nothing".
#       `header_value` normalises quoting and invisible characters and does not
#       read YAML nulls, so `applied: null` is a value: STATUS-NOEDGE does not
#       fire and STATUS-EDGE does, for naming a path that opens as nothing.
#       Rewritten to say which rule catches it.
#       [resolve_note.py:1312-1348 against :1211-1219]
#
#    c. SET-UNCLOSED, "a second block after an unclosed one, which the scan
#       stops before and never examines". The strict scan does stop, and the
#       LOOSE sweep then reports the second block — as E-SET-MALFORMED, which
#       is not what it is. Rewritten to name both halves.
#       [resolve_note.py:672-674 against :697-703]
#
#    d. SET-NESTED, "a block opened inside another and never closed, where the
#       scan restarts at the inner open". With one close for two opens the
#       outer block is reported nested and the close is handed to the INNER
#       block, which then parses cleanly. Rewritten to describe that.
#       [resolve_note.py:675-678]
#
#    e. CITE-NOFILE-REPO, "a path whose only fault is a wrapped line inside the
#       token". A newline inside the PATH collapses to a space and the path
#       stops existing — `docs/ x.md` — so that spelling is refused. The
#       must-NOT-fire case is a token that wrapped between its path and its
#       hash, which is where a hard wrap actually lands. Rewritten.
#       [resolve_note.py:583]
#
#    f. SIDECAR-ROW-REFRESH, "a row with an empty fourth column, which has four
#       columns and no quote to re-resolve". True as far as it goes, and the
#       consequence is worth stating: the empty quote normalises to the empty
#       string, `str.find("")` returns 0, and the row is REFRESHED to line 1
#       with the current hash. An empty quote silently re-pins a citation.
#       [resolve_note.py:908-917]
#
# 5. ONE RULE THAT IS WEAKER THAN ITS ROW READS, REPORTED AND NOT FIXED.
#    GRADE-EXEMPT drops the grade family with `"E-GRADE-" not in d`, which
#    matches the whole defect LINE rather than its code. A note whose only
#    outstanding defect is `E-BARE-PATH untokenised docs/E-GRADE-note.md`
#    therefore has that defect filtered away and is stamped clean. The case
#    above pins the behaviour as it is; changing it is a source edit and
#    belongs to whoever owns the module.
#    [resolve_note.py:977]

# THE THREE ROWS BELOW ARE THE NOTE LAYER'S FIRST WRITER. Every rule above them
# grades a note already on disk. These refuse to put one there, because both
# fields they own -- the dated filename and the oracle -- are derivable from
# the run and were typed, and the corpus already carries dated rows for what
# typing them cost.

[[rule]]
id = "NOTE-BLINDORACLE"
code = "E-NOTE-BLINDORACLE"
layer = "note-contract"
owner = "file_note.file_note"
trigger = "a note is opened from a run"
refuses = "writing an oracle row naming a rendering no gate can read, which is the debt UNFILLED_ORACLES already carries dated rows for; the writer is the only place in the chain that can open the file before the path is committed to"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a run with no readable rendering beside it, refused before any note is written"
test = "tests/test_file_note.py::test_a_run_whose_renderings_no_gate_can_read_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "the rendering chosen is one load_segments actually reads, and never the run manifest, which carries a segment count rather than the segments"
test = "tests/test_file_note.py::test_the_oracle_names_a_rendering_a_gate_can_actually_open"
kind = "pytest"
[[rule.neighbour]]
case = "the same refusal in the module's own selftest"
test = "file_note::a run with no readable rendering is refused"
kind = "selftest"

[[rule]]
id = "NOTE-EXISTS"
code = "E-NOTE-EXISTS"
layer = "note-contract"
owner = "file_note.file_note"
trigger = "a note is opened for a video"
refuses = "opening a second note about one video, keyed on the video id rather than on the filename; the notes are frozen, and two notes about one video is the ambiguity the roll-call spent two rounds learning to refuse"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a second run of the same video on a later date, refused with the first note left untouched"
test = "tests/test_file_note.py::test_a_note_for_this_video_is_never_overwritten"
kind = "pytest"
[[rule.neighbour]]
case = "the same refusal in the module's own selftest"
test = "file_note::a second note about one video is refused"
kind = "selftest"

[[rule]]
id = "NOTE-UNNAMEABLE"
code = "E-NOTE-UNNAMEABLE"
layer = "note-contract"
owner = "file_note.file_note"
trigger = "a note is opened and its name is derived from the run's title"
refuses = "filing under a name the title does not yield, rather than under a machine-chosen placeholder that reads a year later exactly like a title somebody meant"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a title of punctuation only, which folds to nothing"
test = "tests/test_file_note.py::test_a_title_that_yields_no_slug_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "the dated filename the same writer derives, which is what every dated exemption row in this package is compared against"
test = "tests/test_file_note.py::test_the_filename_is_derived_from_the_run_and_not_typed"
kind = "pytest"
[[rule.neighbour]]
case = "the same refusal in the module's own selftest"
test = "file_note::a title with no name in it is refused"
kind = "selftest"
