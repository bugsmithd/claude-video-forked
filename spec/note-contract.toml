kind = "pytest"

[[rule]]
id = "STATUS-APPLIED"
code = "E-STATUS-APPLIED"
layer = "note-contract"
owner = "resolve_note.check_status"
trigger = "the status is one of the four and the field naming the outbound edge has been read"
