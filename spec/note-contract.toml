kind = "pytest"

# --- citations of INSTALLED code, which is a different resolution path --------
# Which path a citation takes is decided by ONE test: the whole value matching
# name@version:relpath. Match, and the citation is resolved against the
# installed distribution and can only reach E-CITE-PKGSPEC, E-CITE-NOPKG,
# E-CITE-VERSION or E-CITE-NOFILE. No match, and it is joined to the corpus
# root and can only reach E-CITE-PATH, E-CITE-NOFILE, E-CITE-SELF,
# E-CITE-UNREADABLE or E-CITE-NOMATCH. E-CITE-EMPTY is decided before either.
#
# A VALUE CAN BE AMBIGUOUS, and the package path wins. A repository file whose
# own name carries an at sign and a colon — `a@1.0:b.md` at the top of the
# corpus — matches the package pattern, so the citation is sent to look for a
# distribution called `a` and comes back as not installed. The repository file
# is never opened and the reader is told the wrong reason.

[[rule]]
id = "CITE-PKGSPEC"
code = "E-CITE-PKGSPEC"
layer = "note-contract"
owner = "resolve_note.package_target"
trigger = "a value is handed to the installed-code resolver"
refuses = "a value that is not a distribution name, an at sign, a version and a path — reachable only by calling the resolver directly, because all three production callers apply the same pattern before calling, so no run can print this code and no run exits on it"
excused_by = []

[[rule.neighbour]]
case = "a value with no at sign at all"
test = "tests/test_spec_note_contract.py::test_a_package_address_with_no_at_sign_is_not_an_address"
kind = "pytest"
[[rule.neighbour]]
case = "a value with a version and no path after the colon"
test = "tests/test_spec_note_contract.py::test_a_package_address_with_no_path_after_the_colon_is_not_an_address"
kind = "pytest"
[[rule.neighbour]]
case = "a value with an empty version between the at sign and the colon"
test = "tests/test_spec_note_contract.py::test_a_package_address_with_an_empty_version_is_not_an_address"
kind = "pytest"
[[rule.neighbour]]
case = "any value reaching this from an ordinary run, which cannot happen: every production caller applies the same pattern before calling, so only a direct call can raise it"
test = "tests/test_spec_note_contract.py::test_no_ordinary_run_can_reach_the_package_address_complaint"
kind = "pytest"

[[rule]]
id = "CITE-NOPKG"
code = "E-CITE-NOPKG"
layer = "note-contract"
owner = "resolve_note.package_target"
trigger = "a citation addresses installed code and the distribution is being located"
refuses = "resolving against a distribution that is not installed here, saying the claim is uncheckable rather than false"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a distribution nobody has installed"
test = "tests/test_spec_note_contract.py::test_a_distribution_nobody_has_installed_is_uncheckable_here"
kind = "pytest"
[[rule.neighbour]]
case = "a distribution name spelled with an underscore where the installed one uses a dash, which packaging calls the same name and which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_an_underscore_spelling_names_the_same_installed_distribution"
kind = "pytest"
[[rule.neighbour]]
case = "a repository file whose own name carries an at sign and a colon, which is sent down this path and reported as an absent package"
test = "tests/test_spec_note_contract.py::test_a_repository_file_named_with_an_at_sign_is_sent_down_the_package_path"
kind = "pytest"
[[rule.neighbour]]
case = "the distribution installed in editable form, where the file list holds only a loader shim and the citation must still resolve"
test = "tests/test_spec_note_contract.py::test_an_editable_install_still_resolves_through_the_import_system"
kind = "pytest"

[[rule]]
id = "CITE-VERSION"
code = "E-CITE-VERSION"
layer = "note-contract"
owner = "resolve_note.package_target"
trigger = "the cited distribution is installed and its version is compared with the one in the address"
refuses = "resolving against any version other than the one the citation was resolved against, because the quote may still be present, at a new line, meaning something else"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a version that was never released"
test = "tests/test_spec_note_contract.py::test_a_version_that_was_never_released_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "the installed version with a trailing zero added, which is the same release under packaging rules and is still refused here because the comparison is string equality"
test = "tests/test_spec_note_contract.py::test_a_version_with_a_trailing_zero_added_is_refused_by_string_equality"
kind = "pytest"
[[rule.neighbour]]
case = "the exact installed version, which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_the_exact_installed_version_resolves"
kind = "pytest"
[[rule.neighbour]]
case = "a sidecar row citing a version that has since moved, which cannot be refreshed and must stay a defect"
test = "tests/test_spec_note_contract.py::test_a_sidecar_row_citing_a_moved_version_cannot_be_refreshed"
kind = "pytest"

[[rule]]
id = "CITE-NOFILE-PKG"
code = "E-CITE-NOFILE"
layer = "note-contract"
owner = "resolve_note.package_target"
trigger = "the cited distribution is installed at the exact version named"
refuses = "a path that release does not ship"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a module name that does not exist in that release"
test = "tests/test_spec_note_contract.py::test_a_module_that_release_does_not_ship_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a path naming a directory inside the package"
test = "tests/test_spec_note_contract.py::test_a_path_naming_a_directory_inside_the_package_is_not_a_file"
kind = "pytest"
[[rule.neighbour]]
case = "a path that is only a suffix of a real shipped path, which the endswith rule must not accept"
test = "tests/test_spec_note_contract.py::test_a_path_that_is_only_a_suffix_of_a_shipped_path_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a real module reached only through the import system because the install is editable, which must NOT be refused"
test = "tests/test_spec_note_contract.py::test_a_shipped_module_is_found_even_when_the_file_list_is_a_shim"
kind = "pytest"

