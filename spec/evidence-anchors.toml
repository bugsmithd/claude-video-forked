[[rule]]
id = "MANIFEST-ARTIFACT"
code = "E-MANIFEST-ARTIFACT"
layer = "evidence"
owner = "anchor_manifest.verify_artifacts"
trigger = "the caller asks for the frames a manifest names to be found again and re-hashed"
