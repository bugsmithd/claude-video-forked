# Layer 2, part one — anchors and manifests.
#
# `anchor_manifest.py` is the only module that reconciles a second a note CITES
# against an artifact the run actually PRODUCED. Twenty-six rules, and before
# this file existed 55 of the wrong answers next door to them were pinned by
# nothing: the fix for each one landed exactly where the finding pointed, and
# the neighbour nobody typed stayed accepted.
#
# Every row here is promoted, which means every neighbour it names has a case
# that exists. `kind = "selftest"` is the module's own labelled check, run
# inside this pytest session by `tests/test_selftests.py`; `kind = "pytest"` is
# a case in `tests/test_spec_evidence_anchors.py` unless the path says
# otherwise. The gaps section at the end of this file says what had to be
# rewritten to get here and what is still wrong in the source.

# --- the anchor itself: is this second one the run produced? ------------------

[[rule]]
id = "ANCHOR-UNRESOLVED"
code = "E-ANCHOR-UNRESOLVED"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "an anchor carries an evidence class and the manifest can actually decide that class"
refuses = "a cited second the run never produced, decided one evidence class at a time and refused on a single half: an ON-SCREEN second with no extracted frame at it, or a SPOKEN or INFERRED second inside no caption span. The two halves are never required together, so a caption span covering an ON-SCREEN second is no defence and a frame under a SPOKEN one is none either"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "an on-screen second seven seconds away from the nearest extracted frame"
test = "anchor_manifest::off-by-seven code"
kind = "selftest"
[[rule.neighbour]]
case = "an on-screen second moved onto a DIFFERENT extracted frame, which must NOT be refused because a swap between two real frames is outside this rule and stays open"
test = "anchor_manifest::a swap onto another extracted frame survives"
kind = "selftest"
[[rule.neighbour]]
case = "a spoken second when the caption spans cover almost the whole runtime, which must NOT be refused because a namespace that cannot fail is switched off instead"
test = "anchor_manifest::spoken with no caption index is unchecked, not resolved"
kind = "selftest"
[[rule.neighbour]]
case = "a spoken second outside every caption span of a namespace that can still fail"
test = "anchor_manifest::non-vacuous cues resolve SPOKEN"
kind = "selftest"
[[rule.neighbour]]
case = "an inferred second outside every caption span of a namespace that can still fail — the same branch as the spoken one and a separate line of code"
test = "tests/test_spec_evidence_anchors.py::test_an_inferred_second_outside_every_caption_span_is_unresolved"
kind = "pytest"
[[rule.neighbour]]
case = "a note whose run is named in the unresolvable_runs ledger, which does NOT excuse this rule: that ledger only downgrades the missing-manifest complaint"
test = "tests/test_spec_evidence_anchors.py::test_the_unresolvable_runs_ledger_does_not_excuse_an_unresolved_anchor"
kind = "pytest"
[[rule.neighbour]]
case = "an on-screen second a caption span DOES hold, which is refused all the same because the frames half decides alone — the neighbour that stops the refusal being read as needing both halves"
test = "tests/test_spec_evidence_anchors.py::test_a_caption_span_over_an_on_screen_second_does_not_resolve_it"
kind = "pytest"

[[rule]]
id = "ANCHOR-UNQUOTED"
code = "E-ANCHOR-UNQUOTED"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "a note line outside a fenced block is scanned for timestamp-shaped text"
refuses = "a timestamp with no backticks on BOTH sides — UNLESS it is written hard against the stamp before it. The scan reads one character past every match it makes, so in a run of stamps with nothing between them every second stamp is never offered to the scan, and the anchor pattern cannot see it either. A bare stamp with any separator in front of it is caught; a bare stamp with none is counted by nothing in the package"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a bare bracketed time in ordinary prose"
test = "anchor_manifest::an unquoted timestamp is a defect"
kind = "selftest"
[[rule.neighbour]]
case = "the same bare time inside a fenced block, which must NOT be refused because quoted text is not a claim"
test = "anchor_manifest::a fenced unquoted timestamp is not"
kind = "selftest"
[[rule.neighbour]]
case = "a properly backticked anchor, which must NOT be refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "a time with a backtick on one side only, which is half-quoted and still invisible to every check"
test = "tests/test_spec_evidence_anchors.py::test_a_timestamp_backticked_on_one_side_only_is_still_invisible"
kind = "pytest"
[[rule.neighbour]]
case = "a BARE three-digit minute, which the anchor pattern caps out of sight and this wider scan exists to catch"
test = "tests/test_spec_evidence_anchors.py::test_a_three_digit_minute_is_caught_by_the_wider_scan"
kind = "pytest"
[[rule.neighbour]]
case = "three bare stamps written hard against each other, where the first and the third are refused and the middle one is offered to nothing — the boundary of this scan, stated so a reader does not write a range with no separator and read the silence as a pass"
test = "tests/test_spec_evidence_anchors.py::test_the_second_of_two_adjacent_bare_stamps_is_offered_to_nothing"
kind = "pytest"

[[rule]]
id = "ANCHOR-UNATTRIBUTED"
code = "E-ANCHOR-UNATTRIBUTED"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "a note finishes being sorted and at least one anchor landed in the unattributable pile"
refuses = "a note that leaves an anchor with no evidence class at all, or with two the tool cannot choose between, AND no other line of the note labelling that same second exactly once. One such line elsewhere takes the anchor out of this pile and into the cross-reference rule, whichever of the two shapes it was in"
excused_by = ["unattributed_notes"]
exit = 1

[[rule.neighbour]]
case = "an anchor in an item that carries no evidence class anywhere"
test = "anchor_manifest::an unattributed anchor fires by default"
kind = "selftest"
[[rule.neighbour]]
case = "a note named in the unattributed_notes ledger, which must NOT be refused but must still be printed"
test = "anchor_manifest::a dated exemption downgrades to a printed note"
kind = "selftest"
[[rule.neighbour]]
case = "the escape hatch given, where nothing is refused"
test = "anchor_manifest::--no-require-evidence-class silences it"
kind = "selftest"
[[rule.neighbour]]
case = "an unlabelled anchor repeating a second the note labels once elsewhere, which must NOT land in this pile"
test = "anchor_manifest::a re-citation of a classed second is cross-referenced"
kind = "selftest"
[[rule.neighbour]]
case = "an item where two labels both touch one anchor, so the printed line must name the contested pile and not the unlabelled one"
test = "tests/test_spec_evidence_anchors.py::test_two_labels_touching_one_anchor_are_counted_as_contested"
kind = "pytest"
[[rule.neighbour]]
case = "that same contested item with an earlier line labelling the second once, which must NOT be refused by this rule and must leave the contested count at zero — the condition that decides which of the two codes a contested anchor gets"
test = "tests/test_spec_evidence_anchors.py::test_a_contested_anchor_with_a_donor_elsewhere_is_cross_referenced"
kind = "pytest"

[[rule]]
id = "ANCHOR-CROSSREF"
code = "E-ANCHOR-CROSSREF"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "an anchor whose own item gave it no ONE class — none at all, two that both miss it, or two that both touch it — repeats a second the note labels exactly once elsewhere"
refuses = "a note leaning on another line's label for this second instead of saying how it knows this moment, in any of those three shapes. The printed line calls every one of them unlabelled, which is the right repair for the first shape and the wrong one for the other two"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "an unlabelled re-citation of a second labelled once earlier"
test = "anchor_manifest::a leaned-on anchor is a defect by default"
kind = "selftest"
[[rule.neighbour]]
case = "the same note through the command line, which is the default a person actually gets"
test = "anchor_manifest::the CLI reaches the default"
kind = "selftest"
[[rule.neighbour]]
case = "the escape hatch given, where the same note must NOT be refused"
test = "anchor_manifest::...and --no-require-touched-class turns it off"
kind = "selftest"
[[rule.neighbour]]
case = "a labelled second one away in either direction, which must NOT donate its class"
test = "anchor_manifest::a donor one second LATER inherits nothing either"
kind = "selftest"
[[rule.neighbour]]
case = "a second the note labels two different ways, which stays unattributable rather than becoming this"
test = "anchor_manifest::a second labelled both ways stays unattributable"
kind = "selftest"
[[rule.neighbour]]
case = "a donor inside a fenced block, which is quoted rather than claimed and donates nothing"
test = "anchor_manifest::a fenced anchor donates no class"
kind = "selftest"
[[rule.neighbour]]
case = "the same second written in another spelling, which must still donate"
test = "anchor_manifest::the same second in another spelling still donates"
kind = "selftest"
[[rule.neighbour]]
case = "a note whose run is named in unresolvable_runs, which does NOT excuse this rule"
test = "tests/test_spec_evidence_anchors.py::test_the_unresolvable_runs_ledger_does_not_excuse_a_leaned_on_anchor"
kind = "pytest"
[[rule.neighbour]]
case = "an item where two labels both TOUCH the anchor and an earlier line labels that second once, which lands here and not in the unattributable pile"
test = "tests/test_spec_evidence_anchors.py::test_a_contested_anchor_with_a_donor_elsewhere_is_cross_referenced"
kind = "pytest"
[[rule.neighbour]]
case = "an item carrying two labels that both MISS the anchor, with the same donor elsewhere, which is the third shape and a separate word in the same branch"
test = "tests/test_spec_evidence_anchors.py::test_an_item_labelled_twice_and_touching_neither_label_is_cross_referenced"
kind = "pytest"

[[rule]]
id = "COVERAGE-GAP"
code = "E-COVERAGE-GAP"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "a ceiling is asked for and the manifest carries both frames and a runtime"
refuses = "a span longer than the ceiling that holds an extracted frame the note never cites"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "an uncited extracted frame sitting inside a span longer than the ceiling"
test = "anchor_manifest::--max-gap fires on a real uncited frame"
kind = "selftest"
[[rule.neighbour]]
case = "a note citing every frame the run extracted, which must NOT be refused however long the video runs"
test = "anchor_manifest::citing every frame is never a coverage defect"
kind = "selftest"
[[rule.neighbour]]
case = "no ceiling asked for, where an uncited frame is counted in the printed ledger and never refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "a span exactly as long as the ceiling, which must NOT be refused because the comparison is strict"
test = "tests/test_spec_evidence_anchors.py::test_a_span_exactly_as_long_as_the_ceiling_is_not_a_coverage_defect"
kind = "pytest"
[[rule.neighbour]]
case = "a spoken anchor landing on the uncited frame's second, which does not count as looking at the screen and so must NOT clear the gap"
test = "tests/test_spec_evidence_anchors.py::test_a_spoken_anchor_on_an_uncited_frames_second_does_not_clear_the_gap"
kind = "pytest"
[[rule.neighbour]]
case = "six anchors on one frame second, which must NOT read as more coverage than one"
test = "tests/test_spec_evidence_anchors.py::test_six_anchors_on_one_second_count_as_one_cited_frame"
kind = "pytest"

[[rule]]
id = "PARTITION"
code = "E-PARTITION"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "every anchor of a note has been given a disposition"
refuses = "an anchor count that does not equal the sum of the piles the anchors were sorted into"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note carrying every pile at once, which must sum"
test = "anchor_manifest::the partition holds"
kind = "selftest"
[[rule.neighbour]]
case = "the same with the appended pile present, which is the member that shifted seven report columns when it was spliced in instead"
test = "anchor_manifest::the partition holds with cross-referenced present"
kind = "selftest"
[[rule.neighbour]]
case = "a note with no anchors at all, where zero must equal zero and nothing may be refused"
test = "tests/test_spec_evidence_anchors.py::test_a_note_with_no_anchors_still_partitions"
kind = "pytest"
[[rule.neighbour]]
case = "an eleventh pile added to the list and never assigned to anything, which must NOT be refused because an unassigned member adds zero — the draft expected this to fire and it does not"
test = "tests/test_spec_evidence_anchors.py::test_a_pile_added_and_never_assigned_is_not_a_partition_defect"
kind = "pytest"
[[rule.neighbour]]
case = "a pile spliced into the list that names a report column already counting anchors, which double-counts them — the edit this rule does catch"
test = "tests/test_spec_evidence_anchors.py::test_a_pile_spliced_in_over_a_report_column_breaks_the_partition"
kind = "pytest"

# --- the manifest: is there one, is it this video's, is it readable? ---------

[[rule]]
id = "MANIFEST-MISSING"
code = "E-MANIFEST-MISSING"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "a note carries on-screen anchors that nothing was able to check"
refuses = "a note whose manifest is absent, unreadable, or present with no frames worth resolving against"
excused_by = ["unresolvable_runs"]
exit = 1

[[rule.neighbour]]
case = "no manifest file for this video at all"
test = "anchor_manifest::missing manifest fires by default"
kind = "selftest"
[[rule.neighbour]]
case = "the escape hatch given, where nothing is refused"
test = "anchor_manifest::--no-require-manifest silences it"
kind = "selftest"
[[rule.neighbour]]
case = "a manifest that exists and carries caption spans but no frames, which is present and not present enough"
test = "anchor_manifest::a frameless manifest does not satisfy the gate"
kind = "selftest"
[[rule.neighbour]]
case = "a run named in the unresolvable_runs ledger, which must NOT be refused but must be printed with its dated reason — the one rule that ledger actually excuses"
test = "tests/test_spec_evidence_anchors.py::test_a_run_in_the_unresolvable_runs_ledger_is_printed_rather_than_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a note with no on-screen anchors and no manifest, which must NOT be refused because nothing went unchecked"
test = "tests/test_spec_evidence_anchors.py::test_a_note_with_no_on_screen_anchors_needs_no_manifest"
kind = "pytest"

[[rule]]
id = "MANIFEST-UNREADABLE"
code = "E-MANIFEST-UNREADABLE"
layer = "evidence"
owner = "anchor_manifest.read_manifest"
trigger = "a manifest file exists and is opened"
refuses = "a manifest that cannot be read back as text"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a manifest the process is not allowed to read"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_the_process_cannot_open_is_reported_not_raised"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest holding bytes that are not text in the expected encoding"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_holding_bytes_that_are_not_utf8_names_the_byte"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest path that is a directory rather than a file"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_path_that_is_a_directory_is_unreadable"
kind = "pytest"
[[rule.neighbour]]
case = "an unreadable manifest that must NOT also produce the video-id and runtime complaints, because reading it fatally is meant to stop those from running"
test = "tests/test_spec_evidence_anchors.py::test_an_unreadable_manifest_stops_the_video_and_duration_checks"
kind = "pytest"

[[rule]]
id = "MANIFEST-ROW"
code = "E-MANIFEST-ROW"
layer = "evidence"
owner = "anchor_manifest.read_manifest"
trigger = "a line of a manifest that is neither a comment nor the header is read"
refuses = "a row that is not five columns of a known kind, a row whose span is not numbers, and a second frame row claiming a second already taken"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a row with two columns instead of five"
test = "anchor_manifest::malformed row reported"
kind = "selftest"
[[rule.neighbour]]
case = "two frame rows naming one second, where a second must name one artifact"
test = "anchor_manifest::duplicate second reported"
kind = "selftest"
[[rule.neighbour]]
case = "the header line and the comment lines, which must NOT be refused — pinned only by the count in the malformed-row case being one rather than four"
test = "anchor_manifest::malformed row reported"
kind = "selftest"
[[rule.neighbour]]
case = "five columns whose kind is neither of the two known ones"
test = "tests/test_spec_evidence_anchors.py::test_a_row_of_an_unknown_kind_is_malformed"
kind = "pytest"
[[rule.neighbour]]
case = "five columns whose start is a word rather than a number, which is the second of the three refusals under this code and is reached by a different branch"
test = "tests/test_spec_evidence_anchors.py::test_a_row_whose_start_is_a_word_is_a_non_numeric_span"
kind = "pytest"
[[rule.neighbour]]
case = "two caption spans sharing a start, which must NOT be refused because only frames are one-per-second"
test = "tests/test_spec_evidence_anchors.py::test_two_caption_spans_may_share_a_start"
kind = "pytest"

[[rule]]
id = "MANIFEST-RANGE"
code = "E-MANIFEST-RANGE"
layer = "evidence"
owner = "anchor_manifest.read_manifest"
trigger = "a manifest states a runtime and holds frame rows"
refuses = "a frame stamped at a second past the end of the video"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a frame stamped well past the stated runtime"
test = "anchor_manifest::frame past runtime reported"
kind = "selftest"
[[rule.neighbour]]
case = "a frame stamped exactly at the runtime, which must NOT be refused because the comparison is strict"
test = "tests/test_spec_evidence_anchors.py::test_a_frame_stamped_exactly_at_the_runtime_is_in_range"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest with no runtime, where this check cannot run at all and must NOT be refused"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_with_no_runtime_cannot_run_the_range_check"
kind = "pytest"
[[rule.neighbour]]
case = "a caption span running past the runtime, which this rule deliberately does not look at"
test = "tests/test_spec_evidence_anchors.py::test_a_caption_span_past_the_runtime_is_not_a_range_defect"
kind = "pytest"

[[rule]]
id = "MANIFEST-NAMESPACE"
code = "E-MANIFEST-NAMESPACE"
layer = "evidence"
owner = "anchor_manifest.read_manifest"
trigger = "a manifest is read back and its declared namespaces are compared with its rows"
refuses = "a namespace declared with no rows behind it, and rows with no namespace declared for them"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "frames declared and no frame rows, which would silently pass every anchor bound to them"
test = "anchor_manifest::empty namespace reported"
kind = "selftest"
[[rule.neighbour]]
case = "declared and populated, which must NOT be refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "caption rows present with no caption namespace declared, which is the other half of this rule and would silently check nothing"
test = "tests/test_spec_evidence_anchors.py::test_caption_rows_with_no_cues_namespace_declared_are_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a namespace name the reader knows nothing about, which is neither declared-empty nor undeclared-full and is passed over in silence"
test = "tests/test_spec_evidence_anchors.py::test_a_namespace_the_reader_knows_nothing_about_is_passed_over"
kind = "pytest"

[[rule]]
id = "MANIFEST-NO-DURATION"
code = "E-MANIFEST-NO-DURATION"
layer = "evidence"
owner = "anchor_manifest.read_manifest"
trigger = "a manifest is read back"
refuses = "a manifest with no runtime, because nothing then dates it and three checks go quiet"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a manifest with no runtime line at all"
test = "anchor_manifest::undated manifest reported"
kind = "selftest"
[[rule.neighbour]]
case = "a manifest with a runtime, which must NOT be refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "a runtime written with a decimal point or a minus sign, which is not plain digits and is silently read as no runtime"
test = "tests/test_spec_evidence_anchors.py::test_a_runtime_that_is_not_plain_digits_reads_as_no_runtime"
kind = "pytest"
[[rule.neighbour]]
case = "a runtime of zero, which the reader cannot tell from unknown and which is the ambiguity this rule was written to name"
test = "tests/test_spec_evidence_anchors.py::test_a_runtime_of_zero_cannot_be_told_from_unknown"
kind = "pytest"

[[rule]]
id = "MANIFEST-VIDEO"
code = "E-MANIFEST-VIDEO"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "a note's manifest was read back without a fatal error"
refuses = "a manifest that declares a different video from the note reading it, or declares none at all"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a manifest declaring the same video, which must NOT be refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "a manifest declaring another video entirely, which would resolve this note's anchors against another video's frames"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_declaring_another_video_is_refused"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest declaring no video at all, where the recorded value is nothing and the note's id is something"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_declaring_no_video_is_refused_against_a_note_that_does"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest that could not be read, where this check must NOT run because there is nothing trustworthy to compare"
test = "tests/test_spec_evidence_anchors.py::test_an_unreadable_manifest_stops_the_video_and_duration_checks"
kind = "pytest"

[[rule]]
id = "MANIFEST-DURATION"
code = "E-MANIFEST-DURATION"
layer = "evidence"
owner = "anchor_manifest.check_note"
trigger = "the note and its manifest both state a runtime"
refuses = "two runtimes more than two seconds apart, which are not the same video"
excused_by = []
exit = 1

[[rule.neighbour]]
case = "a note claiming a runtime a full minute short of the manifest's"
test = "anchor_manifest::duration drift fires"
kind = "selftest"
[[rule.neighbour]]
case = "runtimes that agree, which must NOT be refused"
test = "anchor_manifest::exact anchor clean"
kind = "selftest"
[[rule.neighbour]]
case = "a difference of exactly the two-second tolerance, which must NOT be refused because the comparison is strict"
test = "tests/test_spec_evidence_anchors.py::test_a_difference_of_exactly_the_tolerance_is_not_drift"
kind = "pytest"
[[rule.neighbour]]
case = "a note stating no runtime, where the check cannot run and must NOT be refused"
test = "tests/test_spec_evidence_anchors.py::test_a_note_that_states_no_runtime_cannot_drift"
