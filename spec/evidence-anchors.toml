kind = "selftest"
[[rule.neighbour]]
case = "a frame still on disk whose bytes changed — the second of the two refusals under this code, and the one that separates re-hashing from merely re-finding"
test = "tests/test_spec_evidence_anchors.py::test_a_frame_still_on_disk_with_changed_bytes_is_caught_by_rehashing"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest naming no source directories at all, where the search set is nothing and every frame reads as gone even with the frame sitting on disk under the root the caller passed"
test = "tests/test_spec_evidence_anchors.py::test_a_manifest_naming_no_source_directories_finds_its_frames_nowhere"
kind = "pytest"
[[rule.neighbour]]
case = "a manifest naming two source directories that do not hold the frame, where the line names both of them rather than the word nowhere — the wording is read off the manifest and is not a constant"
test = "tests/test_spec_evidence_anchors.py::test_the_gone_from_line_names_the_source_directories_the_manifest_declared"
kind = "pytest"
[[rule.neighbour]]
case = "a run named in unresolvable_runs, which does NOT excuse this rule"
test = "tests/test_spec_evidence_anchors.py::test_the_unresolvable_runs_ledger_does_not_excuse_a_missing_artifact"
