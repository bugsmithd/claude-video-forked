# =============================================================================
# GAPS
# =============================================================================
#
# RULES LEFT IN THE DRAFT
#
#   None. All 25 rules drafted in `spec/proposed-l2.toml` are promoted here,
#   and all 55 neighbours that carried `kind = "none"` now have a case in
#   `tests/test_spec_evidence_anchors.py`. `ADOPT-TEMP-ROOT` is a
#   twenty-sixth, drafted nowhere: a refute pass found the refusal in the
#   source with no row anywhere and no code to be owed by (finding 4 below).
#
# NEIGHBOURS I COULD NOT WRITE WITHOUT CHANGING SOURCE
#
#   None. One case is conditional rather than absent:
#   `test_a_manifest_the_process_cannot_open_is_reported_not_raised` skips when
#   the suite runs as uid 0, because root reads a mode-000 file and the
#   fixture cannot be built. On any ordinary run it executes.
#
# WHERE THE CODE AND ITS DOCSTRING DISAGREE
#
#   1. A BACKTICKED three-digit minute is counted by nothing, and the module
#      docstring says the opposite.
#      Docstring: `watch-quality/src/watchquality/anchor_manifest.py:173-177`
#      -- "`[105:18]` and a bare [46:30] are both invisible to it ...
#      Deliberately wider than RE_ANCHOR on both counts."
#      Code: `watch-quality/src/watchquality/anchor_manifest.py:1410` skips any
#      stamp with a backtick on BOTH sides, before the minute width is looked
#      at. `RE_ANCHOR` at `watch-quality/src/watchquality/resolve_note.py:159`
#      caps minutes at two digits, so `` `[105:18]` `` is not an anchor either.
#      The wider scan is therefore wider on ONE count, not both: bare stamps of
#      any width are caught, and a backticked three-digit minute is invisible
#      to the anchor pattern and exempt from the unquoted scan at the same
#      time. Reported, not fixed -- a lane that edits the thing it specifies
#      has destroyed its own evidence. The promoted neighbour says BARE so the
#      row does not claim coverage the code does not have.
#
#   2. `E-MANIFEST-MISSING` says "its manifest carries no usable frames
#      namespace" for a manifest that is present and UNREADABLE.
#      Code: `watch-quality/src/watchquality/anchor_manifest.py:1313` routes a
#      fatal manifest to the `unchecked` pile, and the reason string at
#      `watch-quality/src/watchquality/anchor_manifest.py:1372-1373` chooses
#      between "no notes/anchors/<id>.tsv" and the frames-namespace wording on
#      `man is None` alone. So an undecodable manifest produces
#      `E-MANIFEST-UNREADABLE` and a second line blaming the namespace.
#      Pinned as current behaviour by
#      `test_an_unreadable_manifest_stops_the_video_and_duration_checks`.
#
#   3. The `E-ANCHOR-CROSSREF` line says every anchor it counts "carries no
#      class of their own". Two of the three shapes that reach it carry two.
#      Code: `watch-quality/src/watchquality/anchor_manifest.py:1308-1311` sends
#      an anchor here when its item gave it no ONE class -- NONE, MULTI or
#      CONTESTED -- and the second is labelled once elsewhere; the line at
#      `watch-quality/src/watchquality/anchor_manifest.py:1397-1400` describes
#      only the NONE shape. A reader of a CONTESTED note is told to add a class
#      to an anchor that has two, and the contested counter the unattributed
#      line prints separately reads zero for that note. The note is still
#      refused, so this is a repair-instruction defect, not a hole in the gate.
#      Reported, not fixed: the fix is a message change in the source, and a
#      lane that edits the thing it specifies has destroyed its own evidence.
#      Both trigger and refusal now state all three shapes, and
#      `test_a_contested_anchor_with_a_donor_elsewhere_is_cross_referenced`
#      pins the wording as it stands so a repair has to come past a red case.
#
#   4. The adoption refusal for a path the OS owns carries no `E-` code.
#      Code: `watch-quality/src/watchquality/anchor_manifest.py:479-480`. It is
#      a complaint like any other and `main` exits 1 on it
#      (`watch-quality/src/watchquality/anchor_manifest.py:2487-2492`), but
#      `spec/unspecified.toml` is keyed by codes, so a refusal without one
#      could be neither specified nor owed and
#      `test_every_code_in_the_package_is_either_specified_or_owed` could never
#      see it. `ADOPT-TEMP-ROOT` above gives it a row with `code = ""`, the
#      shape already used elsewhere in this spec directory. The message is left
#      exactly as the source prints it.
#
#   5. `E-MANIFEST-ROW` prints the same text, "malformed row", for a wrong
#      column COUNT and for an unknown KIND.
#      Code: `watch-quality/src/watchquality/anchor_manifest.py:586-587`. The
#      two are different repairs and the line does not say which one is due.
#      Both cases are pinned; neither message is changed here.
#
# REFUSES AND NEIGHBOUR LINES REWRITTEN FROM THE DRAFT
#
#   ANCHOR-UNQUOTED  refuses: "with no backticks around it" -> "with no
#     backticks on BOTH sides". The code skips only the both-sides pair
#     (`anchor_manifest.py:1410`), so a half-quoted stamp fires; the draft's
#     wording reads as if one backtick were enough to exempt it.
#   ANCHOR-UNQUOTED  neighbour: "a three-digit minute" -> "a BARE three-digit
#     minute", for finding 1 above.
#   MANIFEST-MISSING refuses: added "unreadable", for finding 2 above.
#   MANIFEST-VIDEO   refuses: added "or declares none at all". A manifest with
#     no `# video_id` leaves the recorded value as None, which is not the
#     note's id, so the rule fires (`anchor_manifest.py:1265-1267`). The draft
#     named that case as a neighbour but not in the refusal.
#   PARTITION        neighbour: the draft called "an eleventh pile added to the
#     list and never assigned to anything" the edit this rule exists for. It is
#     not caught: `blank_row` seeds every member at zero
#     (`anchor_manifest.py:1159-1165`) and the comparison sums the members
#     (`anchor_manifest.py:1365`), so an unassigned member adds nothing. The
#     row now states that as a must-NOT-fire neighbour, and a third neighbour
#     carries the edit that IS caught -- a member spliced in over a report
#     column that already counts anchors.
#   ALL SELFTEST NEIGHBOURS: the draft spelled them
#     `watch-quality/src/watchquality/anchor_manifest.py::selftest::<label>`.
#     `tests/test_spec_conformance.py:94-123` derives `<module stem>::<label>`,
#     so all 64 were respelled `anchor_manifest::<label>`. Every one resolves.
#
# REWRITTEN AGAIN AFTER AN INDEPENDENT REFUTE PASS
#
#   A later pass read every row against the source and mutated the module 62
#   times to see which rows a case would actually defend. Five rows moved.
#
#   ANCHOR-UNRESOLVED refuses: read as a conjunction -- "no frame was extracted
#     at it, AND no caption span holds it" -- and the code applies the two
#     halves separately, one per evidence class
#     (`anchor_manifest.py:1312-1361`). A reader took a caption span as a
#     defence for an ON-SCREEN anchor; it is not one. The refusal now says so
#     and a neighbour puts the span there and watches the anchor be refused
#     anyway.
#   ANCHOR-UNQUOTED  refuses: claimed EVERY un-backticked stamp.
#     `RE_LOOSE_STAMP` ends in `(.?)` (`anchor_manifest.py:177`), so a match
#     eats one character past its `]` and `finditer` resumes after it: in
#     `[a][b][c]` the middle stamp is never offered to the scan, and it is not
#     an anchor either. That is the exact state the rule exists to prevent, and
#     the overstatement pointed the wrong way -- a reader trusting the row
#     writes a range with no separator. The refusal now names the boundary and
#     a neighbour pins it.
#   ANCHOR-CROSSREF  trigger and refuses: "carries no class of its own" is one
#     of three shapes that reach the branch; see finding 3 above.
#   ANCHOR-UNATTRIBUTED refuses: promised to refuse an anchor with two labels
#     the tool cannot choose between, and the code only does so when no other
#     line labels that second exactly once. With a donor, the same anchor
#     becomes `E-ANCHOR-CROSSREF` and the contested count goes to zero. The
#     `classed` condition is now in the refusal and in a neighbour.
#   MANIFEST-ARTIFACT: the row held; its empty-search-set neighbour was
#     defended by nothing. Two mutations survived the whole suite -- falling
#     back to the caller's root when the manifest names no sources, and
#     replacing the derived directory list with the constant "nowhere". The
#     case now writes the frame to disk under that root, so the fallback finds
#     it and the case goes red, and a second neighbour names two real source
#     directories so the wording cannot be a constant.
#
# OTHER FILES TOUCHED, AND WHY
#
#   `spec/unspecified.toml`: the 25 codes promoted here were struck off the
#   debt list. `tests/test_spec_conformance.py:232-236` fails a code that is
#   both specified and owed, so promotion and striking are one edit.
#   `E-CAPTION-EMPTY` was owed by `anchor_manifest, spoken_vote`; striking it
#   clears the whole row, so the `spoken_vote` half of that code is now
#   specified by this file's `CAPTION-EMPTY` rule and by nothing else. The
#   layer-2 witness lane should give it a row of its own rather than re-owe it.
