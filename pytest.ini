[pytest]
# TEMPORARY DIRECTORIES ARE DELETED, NOT RENAMED. pytest's default keeps the
# last three runs' roots and, when it cannot delete one, renames it to
# `garbage-<uuid>` and moves on -- silently. On 2026-08-24 two of those held
# 348G between them and took a 926G volume down to 116.7M free, which blocked
# every write on the machine including git.
#
# `failed` keeps the temporary directory of a test that FAILED, which is the
# only one anybody reads afterwards, and removes the rest as the run goes.
# `1` bounds what survives across runs to a single root.
#
# The root cause is fixed where it lives -- `_repo_of` in
# `tests/test_spec_conformance.py` and the destination check in
# `_Sandbox.__init__` -- and this is the second wall: a harness bug should cost
# one run's disk, not the disk.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
